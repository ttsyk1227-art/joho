# ブラウザ版どら焼きキャッチ（games/web）とフローチャート学習ツール（tools/flowchart）を
# GitHub Pages に公開するワークフロー
#
# main ブランチの games/web か tools/flowchart が変わるたびに公開し直す。
# （ゲームは pygbag でブラウザ用に変換する。フローチャートはそのままコピーする）
# 公開先: https://<ユーザー名>.github.io/<リポジトリ名>/dorayaki/
#         https://<ユーザー名>.github.io/<リポジトリ名>/flowchart/
#
# 最初に 1 回だけ、GitHub のリポジトリで次の設定が必要:
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: ブラウザ版ゲームと学習ツールを公開

on:
  push:
    branches: [main]
    paths:
      - "games/web/**"
      - "tools/flowchart/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:   # Actions タブから手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pygbag をインストール
        run: pip install pygbag==0.9.3

      - name: ブラウザ用に変換
        run: python -m pygbag --build games/web

      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site/dorayaki
          cp -r games/web/build/web/. _site/dorayaki/
          mkdir -p _site/flowchart
          cp -r tools/flowchart/. _site/flowchart/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>情報Ⅰ 教材</title></head>
          <body style="font-family: sans-serif; padding: 16px;">
          <h1>情報Ⅰ 教材</h1>
          <ul>
          <li><a href="flowchart/">フローチャート・トレーサー</a></li>
          <li><a href="dorayaki/">どら焼きキャッチ（Python ゲーム）</a></li>
          </ul>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dorayaki/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
