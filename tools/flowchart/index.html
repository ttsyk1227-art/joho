<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フローチャート・トレーサー（情報Ⅰ）</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #1d2330; --sub: #5d6678; --line: #d5d9e2;
  --node: #ffffff; --stroke: #3b4558; --cur: #ffc94d; --cur-ink: #2a1c00; --cur-line: #b97700;
  --pend: #2f6fed; --hover: #dbe7ff; --ok: #188a4c; --ng: #c8322b; --chg: #ffe7a6;
  --code-bg: #f8f9fb; --btn: #2f6fed; --btn-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --panel: #1e222b; --ink: #e8ebf2; --sub: #9aa3b5; --line: #353b48;
    --node: #262b36; --stroke: #aab3c5; --cur: #f2b632; --cur-ink: #201500; --cur-line: #ffdd8a;
    --pend: #7aa7ff; --hover: #2c3b5c; --ok: #4fce8b; --ng: #ff7a72; --chg: #6b5310;
    --code-bg: #181b22; --btn: #4d84f5; --btn-ink: #ffffff;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6; display: flex; flex-direction: column;
}
header { padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 18px; margin: 0 0 6px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.bar label { color: var(--sub); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
select, input[type=number], input[type=text] {
  max-width: 100%;
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
}
input[type=number] { width: 84px; }
input.list { width: 190px; }
#desc { margin: 6px 0 0; color: var(--sub); font-size: 13px; }
#inputErr { color: var(--ng); font-size: 13px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0; padding: 6px 12px; color: var(--sub); border-bottom: 1px solid var(--line); font-weight: 600; }
#flowPanel { display: flex; flex-direction: column; min-height: 0; }
#flowWrap { flex: 1; overflow: auto; padding: 10px; text-align: center; position: relative; }
#flowWrap svg { height: auto; }
#side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }

/* フローチャート */
.node .shape { fill: var(--node); stroke: var(--stroke); stroke-width: 1.6; transition: fill .15s; }
.node text { fill: var(--ink); font-size: 13.5px; }
.node { cursor: default; }
.node.hover .shape { fill: var(--hover); }
.node.cur .shape { fill: var(--cur); stroke: var(--cur-line); stroke-width: 3; }
.node.cur text { fill: var(--cur-ink); font-weight: 700; }
.node.pend .shape { stroke: var(--pend); stroke-width: 3; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: var(--stroke); stroke-width: 1.5; }
.ahead { fill: var(--stroke); }
.blabel { fill: var(--sub); font-size: 12.5px; }
.blabel.taken { fill: var(--cur-line); font-weight: 700; font-size: 14px; }

/* Python */
#code { margin: 0; padding: 8px 0; background: var(--code-bg); border-radius: 0 0 10px 10px; overflow-x: auto;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.7; }
.ln { display: flex; white-space: pre; padding: 0 12px 0 0; border-left: 4px solid transparent; }
.ln .no { width: 34px; text-align: right; padding-right: 10px; color: var(--sub); user-select: none; flex: none; }
.ln.hover { background: var(--hover); }
.ln.cur { background: var(--cur); color: var(--cur-ink); border-left-color: var(--cur-line); font-weight: 700; }
.ln.cur .no { color: var(--cur-ink); }
.ln.pend { border-left-color: var(--pend); }

/* 変数・出力 */
#vars { padding: 8px 12px; min-height: 52px; }
#vars table { border-collapse: collapse; }
#vars th { text-align: left; font-family: Consolas, Menlo, monospace; font-weight: 600; padding: 3px 14px 3px 0; vertical-align: middle; }
#vars td { padding: 3px 0; }
.val { display: inline-block; min-width: 44px; text-align: center; padding: 1px 10px; border: 1px solid var(--line); border-radius: 6px;
  font-family: Consolas, Menlo, monospace; font-size: 15px; }
.val.chg, .cell.chg b { background: var(--chg); border-color: var(--cur-line); font-weight: 700; }
.cells { display: inline-flex; gap: 3px; }
.cell { display: inline-flex; flex-direction: column; align-items: center; font-family: Consolas, Menlo, monospace; }
.cell i { font-style: normal; font-size: 11px; color: var(--sub); line-height: 1.2; }
.cell b { font-weight: 400; min-width: 34px; text-align: center; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }
.empty { color: var(--sub); font-size: 13px; }
#out { margin: 0; padding: 8px 12px; min-height: 40px; font-family: Consolas, Menlo, monospace; font-size: 14px; white-space: pre-wrap; }

/* 操作 */
footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 16px 10px; }
#msg { min-height: 28px; font-size: 15px; font-weight: 600; }
#msg .ok { color: var(--ok); } #msg .ng { color: var(--ng); }
#quiz { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; padding: 6px 10px;
  border: 2px dashed var(--pend); border-radius: 8px; }
#quiz.on { display: flex; }
#quiz input { width: 110px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.main { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 700; padding: 6px 20px; }
button:disabled { opacity: .45; cursor: default; }
#slider { flex: 1; min-width: 120px; }
#count, #score { font-size: 13px; color: var(--sub); white-space: nowrap; }
.ctl label { font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 4px; }
.hint { font-size: 12px; color: var(--sub); margin-top: 4px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  #flowWrap { max-height: 58vh; }
  #side { overflow: visible; }
  footer { position: sticky; bottom: 0; }
  .hint { display: none; }
}
.node.rail .shape, .node.rail.cur .shape, .node.rail.pend .shape { fill: none; }
.node.rail .shape { stroke-width: 1.5; }
.node.rail.cur .shape { stroke-width: 4; }
.notice { margin: 0; padding: 14px 16px; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; font-size: 14px; color: var(--sub); white-space: normal; }
.kind { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 10px; color: #fff; background: #2f6fed; margin-right: 4px; }
.kind.k-task { background: #d9730d; } .kind.k-sup { background: #6b7280; }
.frame { font-size: 12px; color: var(--sub); margin: 4px 0 2px; font-weight: 600; }
.frame.dim, table.dim { opacity: .55; }

/* ---------- A4 プリント ---------- */
#printView { display: none; }
body.printing > header, body.printing > main, body.printing > footer { display: none; }
body.printing #printView { display: block; }
body.printing { height: auto; display: block; }
#printBar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; }
.pbrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.pbrow label { font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
#pCount { font-size: 13px; color: var(--sub); }
#pNote { margin: 4px 0 0; font-size: 12px; color: var(--sub); }
#pages { padding: 16px; overflow-x: auto; }
.page {
  width: 190mm; height: 270mm; margin: 0 auto 16px; padding: 10mm; box-sizing: content-box;
  background: #fff; color: #000; box-shadow: 0 1px 6px rgba(0,0,0,.25); overflow: hidden;
  display: flex; flex-direction: column; font-size: 10.5pt; line-height: 1.45;
}
.ph { border-bottom: 1.5px solid #000; padding-bottom: 1.5mm; }
.ptop { display: flex; justify-content: space-between; align-items: flex-end; gap: 4mm; font-size: 9.5pt; }
.pt { font-size: 14pt; font-weight: 700; margin-top: 1mm; }
.pkind { display: inline-block; border: 1px solid #000; border-radius: 3mm; padding: 0 2.5mm; font-size: 9pt; margin-right: 2mm; vertical-align: 1px; }
.pname { font-size: 10pt; white-space: nowrap; }
.pname span { display: inline-block; border-bottom: 1px solid #000; min-width: 9mm; text-align: center; margin: 0 1mm; }
.pname span.nm { min-width: 42mm; }
.pdesc { margin: 2mm 0 0; font-size: 9.5pt; }
.pdesc b { font-weight: 700; }
.pdata { margin: 1mm 0 0; font-size: 9.5pt; font-family: Consolas, Menlo, "Liberation Mono", monospace; }
.pbody { flex: 1; min-height: 0; display: flex; gap: 4mm; margin-top: 2.5mm; }
.pflow { flex: 0 0 50%; min-width: 0; border: 1px solid #000; display: flex; flex-direction: column; }
.pcode { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2.5mm; }
.pcap { font-size: 9pt; font-weight: 700; border-bottom: 1px solid #000; padding: .5mm 2mm; background: #fff; }
.pfig { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; padding: 1.5mm; }
.pfig svg { width: 100%; height: 100%; }
.pwrite { flex: 1; min-height: 0; border: 1px solid #000; display: flex; flex-direction: column; }
.prows { flex: 1; min-height: 0; overflow: hidden; }
.prow { display: flex; align-items: flex-end; border-bottom: 1px solid #b8b8b8; box-sizing: border-box; position: relative; }
.prow i { font-style: normal; width: 7mm; flex: none; text-align: right; padding-right: 1.5mm; font-size: 7.5pt; color: #666; align-self: center; }
.prow code { font-family: Consolas, Menlo, "Liberation Mono", monospace; white-space: pre; overflow: hidden; padding-bottom: .6mm; color: #000; }
.prow .g { position: absolute; top: 0; bottom: 0; border-left: 1px dotted #d0d0d0; }
.pout { border: 1px solid #000; flex: none; max-height: 45%; overflow: hidden; display: flex; flex-direction: column; }
.pout .pin { font-size: 8.5pt; padding: 1mm 2mm 0; }
.pout pre { margin: 0; padding: 1mm 2mm 1.5mm; font-family: Consolas, Menlo, "Liberation Mono", monospace; font-size: 8.5pt; line-height: 1.35; white-space: pre; overflow: hidden; }
.pout pre.c2 { column-count: 2; } .pout pre.c3 { column-count: 3; }
.page .shape { fill: #fff; stroke: #000; stroke-width: 1.3; }
.page .node.rail .shape { fill: none; }
.page .node text { fill: #000; font-size: 12.5px; }
.page .edge { stroke: #000; stroke-width: 1.2; }
.page .ahead { fill: #000; }
.page .blabel { fill: #000; font-size: 11px; }
@page { size: A4 portrait; margin: 10mm; }
@media print {
  body.printing { background: #fff; }
  body.printing #printBar { display: none; }
  #pages { padding: 0; overflow: visible; }
  .page { margin: 0; padding: 0; box-shadow: none; break-after: page; page-break-after: always; }
  .page:last-child { break-after: auto; page-break-after: auto; }
}
</style>
</head>
<body>
<header>
  <h1>フローチャート・トレーサー <span style="font-size:13px;font-weight:400;color:var(--sub)">― 1ステップずつ動かして、Python と見くらべよう</span></h1>
  <div class="bar">
    <label>回 <select id="lesSel"></select></label>
    <label>プログラム <select id="exSel"></select></label>
    <button id="bPrint" title="A4 のプリントを作る">🖨 プリント</button>
    <span id="inputs" class="bar"></span>
    <span id="inputErr"></span>
  </div>
  <p id="desc"></p>
</header>

<main>
  <section class="panel" id="flowPanel">
    <h2>フローチャート</h2>
    <div id="flowWrap"></div>
  </section>
  <div id="side">
    <section class="panel"><h2 id="codeTitle">Python プログラム</h2><div id="code"></div></section>
    <section class="panel"><h2>変数の値</h2><div id="vars"></div></section>
    <section class="panel"><h2>表示（出力）</h2><pre id="out"></pre></section>
  </div>
</main>

<footer>
  <div id="msg"></div>
  <div id="quiz"></div>
  <div class="ctl">
    <button id="bFirst" title="最初へ">⏮ 最初へ</button>
    <button id="bPrev" title="1つ戻る（←）">◀ 戻る</button>
    <button id="bNext" class="main" title="1つ進む（→）">次へ ▶</button>
    <button id="bPlay" title="自動で進める（スペース）">▶ 自動再生</button>
    <label>速さ <select id="speed"><option value="1400">ゆっくり</option><option value="800" selected>ふつう</option><option value="350">はやい</option></select></label>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="ステップ">
    <span id="count"></span>
    <label><input type="checkbox" id="predict"> 予想モード</label>
    <span id="score"></span>
  </div>
  <div class="hint">キーボード：→ 次へ ／ ← 戻る ／ スペース 自動再生。図の記号にマウスを重ねると、対応する Python の行が光ります。</div>
</footer>

<div id="printView">
  <div id="printBar">
    <div class="pbrow">
      <strong>A4 プリント</strong>
      <label>範囲 <select id="pRange">
        <option value="cur">このプログラムだけ</option>
        <option value="les">この回の例題と課題</option>
        <option value="lesK">この回の課題だけ</option>
        <option value="allK">全部の回の課題</option>
        <option value="all">全部（例題・課題・補充）</option>
      </select></label>
      <label>右の欄 <select id="pMode">
        <option value="blank">書きこみ用（空欄）</option>
        <option value="code">プログラムつき</option>
      </select></label>
      <label><input type="checkbox" id="pOut" checked> 実行例を載せる</label>
      <button id="pPrint" class="main">🖨 印刷する</button>
      <button id="pBack">← もどる</button>
      <span id="pCount"></span>
    </div>
    <p id="pNote"></p>
  </div>
  <div id="pages"></div>
</div>

<script>
'use strict';
/* =====================================================================
   プログラムの書き方（図の文・Python の行は、入力値 inp を受け取る関数にもできる）
   A(図の文, Pythonの行, 実行内容)                     … 処理（長方形）
   IN(変数名, 図の文, Pythonの行)                      … 入力（平行四辺形）
   OUT(図の文, Pythonの行, 表示する文字列)              … 表示（平行四辺形）
   IF(図の条件, Pythonの条件, 判定, Yesの処理, Noの処理)  … 判断（ひし形）
   WHILE(図の条件, Pythonの条件, 判定, 繰り返す処理)      … ループ端
   LOOP(繰り返す処理) と BREAK()                        … while True と break
   FOR(変数名, 図の文, Pythonの行, 値の並び, 繰り返す処理)
   CALL(図の文, Pythonの行, 関数名, 引数, 戻ったあとの処理) … 関数の呼び出し（定義済み処理）
   RET(図の文, Pythonの行, 返す値)                      … return
   ===================================================================== */
const A = (fc, py, run) => ({ t: 'assign', fc, py, run });
const IN = (name, fc, py, get) => ({ t: 'input', name, fc, py, get });
const OUT = (fc, py, val) => ({ t: 'output', fc, py, val });
const IF = (fc, py, cond, then, els = [], elif = false) => ({ t: 'if', fc, py, cond, then, els, elif });
const WHILE = (fc, py, cond, body) => ({ t: 'while', fc, py, cond, body });
const LOOP = body => ({ t: 'while', fc: 'ずっと繰り返す', py: 'True', cond: () => true, body, forever: true });
const BREAK = () => ({ t: 'break', fc: '', py: 'break' });
const FOR = (v, fc, py, vals, body) => ({ t: 'for', v, fc, py, vals, body });
const CALL = (fc, py, fn, args, done) => ({ t: 'call', fc, py, fn, args, done });
const RET = (fc, py, val, float = false) => ({ t: 'ret', fc, py, val, float });

// 小道具
const R = (a, b, s = 1) => { const r = []; for (let k = a; k <= b; k += s) r.push(k); return r; };   // a から b まで
const pf = x => (Number.isInteger(x) ? x.toFixed(1) : String(x));                                    // Python の小数の表示
const lit = (a, f) => '[' + a.map(x => (typeof x === 'string' ? '"' + x + '"' : f ? pf(x) : x)).join(', ') + ']';
const round1 = x => {                                                                                // Python の round(x, 1)
  if ((x * 20) % 1 === 0 && Math.abs((x * 10) % 1) === 0.5) { const lo = Math.floor(x * 10); return (lo % 2 === 0 ? lo : lo + 1) / 10; }
  return Number(x.toFixed(1));
};
const nx = (io, key, arr, def) => { const i = io.k[key] || 0; io.k[key] = i + 1; return i < arr.length ? arr[i] : def; };
// リストを用意する処理（長いときは図の文を短くする）
const LISTA = (name, key, f) => A(
  inp => { const s = lit(inp[key], f); return s.length <= 22 ? `${name} ←\n${s}` : `${name} ← ${inp[key].length} 個の\n値のリスト`; },
  inp => `${name} = ${lit(inp[key], f)}`, (e, inp) => { e[name] = inp[key].slice(); });
const sumOf = a => a.reduce((x, y) => x + y, 0);

const EX = '例題', K1 = '課題（基本）', K2 = '課題（発展）', SUP = '補充';

const LESSONS = [
  { title: '第1回 Colabと出力', progs: [
    { kind: EX, title: '自己紹介を表示する', desc: '上から順番に1つずつ実行する「順次構造」。「"」で囲むと、計算ではなく文字として表示される。',
      head: ['# 自己紹介を表示する'],
      body: () => [
        OUT('「はじめまして」と表示', 'print("はじめまして")', () => 'はじめまして'),
        OUT('「好きな食べ物は\nカレーです」と表示', 'print("好きな食べ物はカレーです")', () => '好きな食べ物はカレーです'),
        OUT('3 + 4 の計算結果を表示', 'print(3 + 4)', () => '7'),
        OUT('文字「3 + 4」を表示', 'print("3 + 4")   # 「"」で囲むと文字として表示される', () => '3 + 4'),
      ] },
    { kind: K1, title: '名前・部活動・趣味を3行で表示', desc: '表示する内容は自由。図のとおり、表示の記号を3つ順番に並べればよい。',
      body: () => [
        OUT('名前を表示', 'print("名前: 山田 花子")', () => '名前: 山田 花子'),
        OUT('部活動を表示', 'print("部活動: 吹奏楽部")', () => '部活動: 吹奏楽部'),
        OUT('趣味を表示', 'print("趣味: 読書")', () => '趣味: 読書'),
      ] },
    { kind: K2, title: '記号で絵を描く', desc: '1行ずつ表示を並べると、上から順に絵ができていく（作例：木）。',
      body: () => [
        ...[1, 3, 5, 7, 9].map((n, i) => { const s = ' '.repeat(4 - i) + '*'.repeat(n); return OUT(`* を ${n} 個表示`, `print("${s}")`, () => s); }),
        OUT('# を表示（幹）', 'print("    #")', () => '    #'),
        OUT('# を表示（幹）', 'print("    #")', () => '    #'),
      ] },
  ] },
  { title: '第2回 変数と計算', progs: [
    { kind: EX, title: '買い物の合計金額', desc: '変数に値を入れ、その変数を使って計算する。値段や個数を変えて、変数の変化を確かめよう。',
      inputs: [{ name: 'price', label: '値段', def: 150, min: 1, max: 9999 }, { name: 'count', label: '個数', def: 4, min: 1, max: 99 }],
      floats: ['tax'], head: ['# 買い物の合計金額'],
      body: () => [
        A(inp => `price ← ${inp.price}`, inp => `price = ${inp.price}      # 1個の値段（円）`, (e, inp) => { e.price = inp.price; }),
        A(inp => `count ← ${inp.count}`, inp => `count = ${inp.count}        # 個数`, (e, inp) => { e.count = inp.count; }),
        A('total ← price × count', 'total = price * count', e => { e.total = e.price * e.count; }),
        A('tax ← total × 0.1', 'tax = total * 0.1', e => { e.tax = e.total * 0.1; }),
        OUT('合計と税込の金額を表示', 'print(f"合計 {total} 円、税込 {total + tax} 円")', e => `合計 ${e.total} 円、税込 ${pf(e.total + e.tax)} 円`),
      ] },

/* 課題の Python を見せるかどうか。
   ふだんは見せない（フローチャートを読んで自分で書く練習にするため）。
   アドレスの最後に ?teacher=1 を付けて開くと、課題でも Python を表示する（解説用）。 */
const TEACHER = new URLSearchParams(location.search).has('teacher');

/* ---------- 準備：ノードに番号・表示文をつける ---------- */
const STEP_LIMIT = 3000;
let ex, prog, inp, T = [], idx = 0, lineOf = {}, pyLines = [], dump = {}, floatSet = new Set(), showPy = true;
let playing = null, predict = false, pending = false, fb = null, answered = new Set(), score = { ok: 0, n: 0 };

function prepare(block, st) {
  for (const n of block) {
    n.id = 'n' + (st.id++);
    const s = x => (typeof x === 'function' ? x(inp) : x);
    n.pyText = s(n.py);
    let fc = s(n.fc);
    n.fcText = fc.replace(/\n/g, ' ');
    if (n.t === 'for' || n.t === 'while') { n.loopName = 'ループ' + (++st.loop); fc = n.loopName + '\n' + fc; n.endId = n.id + 'e'; }
    n.lines = fc.split('\n');
    if (n.then) prepare(n.then, st);
    if (n.els) prepare(n.els, st);
    if (n.body) prepare(n.body, st);
  }
}

/* ---------- 実行して、全ステップの記録（トレース）を作る ---------- */
function fmt(v, name) {
  if (Array.isArray(v)) return '[' + v.map(x => fmt(x, name)).join(', ') + ']';
  if (typeof v === 'string') return '"' + v + '"';
  if (typeof v === 'number' && floatSet.has(name)) return pf(v);
  return String(v);
}
const clone = x => JSON.parse(JSON.stringify(x));

function diffEnv(a, b) {           // b で変わった所の一覧
  const ch = [];
  for (const k of Object.keys(b)) {
    if (Array.isArray(b[k]) && Array.isArray(a[k]) && a[k].length === b[k].length) {
      b[k].forEach((v, i) => { if (v !== a[k][i]) ch.push({ name: k, i, label: `${k}[${i}]`, val: v }); });
    } else if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) ch.push({ name: k, label: k, val: b[k] });
  }
  return ch;
}
const chText = ch => ch.map(c => `${c.label} が ${fmt(c.val, c.name)} になった`).join('、');

function buildTrace() {
  const frames = [{ name: 'メイン', env: {} }], out = [], S = [];
  const io = { k: {}, stdin: [], rand: [] };
  let env = frames[0].env;
  const snap = (id, msg, extra = {}) => {
    if (S.length >= STEP_LIMIT) throw new Error('limit');
    S.push({ id, env: clone(env), frames: clone(frames), out: out.slice(), msg, ...extra });
  };
  const step = n => {
    if (n.t === 'assign') {
      const before = clone(env);
      n.run(env, inp, io);
      const ch = diffEnv(before, env);
      let q = null;
      if (ch.length === 1 && !Array.isArray(ch[0].val)) q = { kind: 'value', label: ch[0].label, answer: ch[0].val };
      snap(n.id, ch.length ? chText(ch) : '代入したが、値は前と同じだった', { q });
    } else if (n.t === 'input') {
      env[n.name] = n.get ? n.get(inp, io) : inp[n.name];
      io.stdin.push(String(env[n.name]));
      snap(n.id, `${n.name} に ${fmt(env[n.name], n.name)} が入力された`);
    } else if (n.t === 'output') {
      const s = n.val(env, inp); out.push(s);
      snap(n.id, `「${s}」と表示した`);
    } else if (n.t === 'break') {
      snap(n.id, 'break：繰り返しを抜けて、ループの下へ進む');
      return 'break';
    } else if (n.t === 'ret') {
      const v = n.val(env, inp);
      snap(n.id, `${Array.isArray(v) ? v.map(x => fmt(x)).join('、') : (n.float ? pf(v) : fmt(v))} を返して、呼び出した所へ戻る`);
      return { ret: v };
    } else if (n.t === 'call') {
      const f = prog.funcs.find(x => x.name === n.fn), args = n.args(env, inp);
      snap(n.id, `関数 ${f.name} を呼び出す（${f.params.map((p, i) => `${p} = ${fmt(args[i])}`).join('、')}）`);
      const caller = env;
      env = {}; f.params.forEach((p, i) => { env[p] = clone(args[i]); });
      frames.push({ name: f.name, env });
      snap(f.id, `関数 ${f.name} の処理を始める`);
      const r = exec(f.body);
      frames.pop(); env = caller;
      const before = clone(env), o = n.done(env, r ? r.ret : undefined, inp), ch = diffEnv(before, env);
      if (typeof o === 'string') out.push(o);
      snap(n.id, '関数から戻った。' + (ch.length ? chText(ch) : '') + (typeof o === 'string' ? `「${o}」と表示した` : ''));
    } else if (n.t === 'if') {
      const r = !!n.cond(env, inp);
      snap(n.id, `条件「${n.fcText}」は${r ? '成り立つ → Yes へ進む' : '成り立たない → No へ進む'}`,
        { branch: r ? 'yes' : 'no', q: { kind: 'yn', text: `条件「${n.fcText}」は成り立つ？`, answer: r } });
      return exec(r ? n.then : n.els);
    } else if (n.t === 'while') {
      for (;;) {
        const r = !!n.cond(env, inp), c = n.fcText.replace(/ の間$/, '');
        if (n.forever) snap(n.id, '条件なしで繰り返す（抜けるのは break のときだけ）');
        else snap(n.id, r ? `条件「${c}」が成り立つので、繰り返しの中へ進む` : `条件「${c}」が成り立たないので、繰り返しを終わる`,
          { q: { kind: 'yn', text: `条件「${c}」は成り立つ？（繰り返しを続ける？）`, answer: r } });
        if (!r) break;
        const s = exec(n.body);
        if (s === 'break') break;
        if (s) return s;
        snap(n.endId, n.forever ? `${n.loopName} の先頭に戻る` : `${n.loopName} の先頭に戻って、条件をもう一度調べる`);
      }
    } else if (n.t === 'for') {
      const vals = n.vals(env, inp);
      if (!vals.length) { snap(n.id, '繰り返す値が1つもないので、1回も繰り返さない'); return; }
      for (let k = 0; k < vals.length; k++) {
        env[n.v] = vals[k];
        snap(n.id, k === 0 ? `${n.v} を ${fmt(vals[k])} にして、繰り返しを始める` : `${n.v} を次の値 ${fmt(vals[k])} に進める`);
        const s = exec(n.body);
        if (s === 'break') break;
        if (s) return s;
        snap(n.endId, k < vals.length - 1 ? `${n.loopName} の先頭に戻る` : `最後の値まで繰り返したので、${n.loopName} を終わる`);
      }
    }
  };
  const exec = block => { for (const n of block) { const r = step(n); if (r) return r; } };
  snap('start', '「次へ ▶」を押して、1ステップずつ進めよう');
  try { exec(prog.body); snap('end', 'プログラムが終了した'); }
  catch (err) {
    if (err.message !== 'limit') throw err;
    const l = S[S.length - 1];
    S.push({ id: l.id, env: l.env, frames: l.frames, out: l.out, msg: `ステップ数が ${STEP_LIMIT} をこえたので、ここで打ち切りました（入力を小さくしてください）` });
  }
  dump = { stdin: io.stdin, rand: io.rand, out };
  return S;
}

/* ---------- Python プログラムを作る ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function buildPython() {
  const L = []; lineOf = {};
  const add = (text, ind, ids) => { for (const id of ids) lineOf[id] = L.length; L.push({ text: '    '.repeat(ind) + text, ids }); };
  const genIf = (n, ind, kw) => {
    add(`${kw} ${n.pyText}:`, ind, [n.id]);
    gen(n.then, ind + 1);
    if (!n.els.length) return;
    if (n.els.length === 1 && n.els[0].t === 'if' && n.els[0].elif) genIf(n.els[0], ind, 'elif');
    else { add('else:', ind, []); gen(n.els, ind + 1); }
  };
  const gen = (block, ind) => {
    for (const n of block) {
      if (n.t === 'if') genIf(n, ind, 'if');
      else if (n.t === 'while') { add(`while ${n.pyText}:`, ind, [n.id, n.endId]); gen(n.body, ind + 1); }
      else if (n.t === 'for') { add(n.pyText, ind, [n.id, n.endId]); gen(n.body, ind + 1); }
      else add(n.pyText, ind, [n.id]);
    }
  };
  (ex.head || []).forEach(h => add(h, 0, []));
  for (const f of prog.funcs) { add(f.py, 0, [f.id, f.id + 'x']); gen(f.body, 1); add('', 0, []); }
  gen(prog.body, 0);
  pyLines = L.map(l => l.text);
  $('codeTitle').textContent = 'Python プログラム' + (showPy && ex.kind !== EX && ex.kind !== SUP ? '（教員用表示）' : '');
  if (!showPy) {
    lineOf = {};
    $('code').innerHTML = '<p class="notice">この課題の Python は表示していません。<br>フローチャートを読んで、Colab のノートに自分でプログラムを書いてみよう。<br>書けたら、同じ入力で実行して、このページの「表示（出力）」と同じになるか確かめよう。</p>';
    return;
  }
  $('code').innerHTML = L.map((l, i) =>
    `<div class="ln" data-line="${i}" data-ids="${l.ids.join(' ')}"><span class="no">${i + 1}</span><span>${esc(l.text) || ' '}</span></div>`).join('');
}

/* ---------- フローチャートを描く ---------- */
const GEOM = {
  screen: { W: 210, GY: 28, GX: 36, DH: 78, HE: 38, TH: 36, TW: 120, NMIN: 44, NB: 22, NL: 18, LBY: 15 },
  print: { W: 196, GY: 14, GX: 26, DH: 64, HE: 28, TH: 28, TW: 110, NMIN: 32, NB: 12, NL: 16, LBY: 11 },   // 印刷用は間を詰める
};
let W, GY, GX, DH, HE, TH, TW, NMIN, NB, NL, LBY;
const useGeom = k => { ({ W, GY, GX, DH, HE, TH, TW, NMIN, NB, NL, LBY } = GEOM[k]); };
useGeom('screen');

// elif が続く分岐（3つ以上に分かれる）は、ひし形を縦に並べ、Yes の処理を右にまとめる
function chainOf(n) {
  if (!(n.els.length === 1 && n.els[0].t === 'if' && n.els[0].elif)) return null;
  const lv = []; let c = n;
  for (;;) { lv.push(c); if (c.els.length === 1 && c.els[0].t === 'if' && c.els[0].elif) c = c.els[0]; else break; }
  if (lv.some(x => endsBreak(x.then))) return null;   // Yes 側に break があるときは、ふつうの描き方にする
  return { lv, fin: c.els, finBrk: endsBreak(c.els) };   // 最後の No 側の break は、ループの左側を通って外へ出す
}
const vis = b => b.filter(n => n.t !== 'break');
const endsBreak = b => b.length > 0 && b[b.length - 1].t === 'break';
let mctx = [];

function measureBlock(b) {
  let L = 0, R = 0, h = 0;
  vis(b).forEach((n, i) => { measureNode(n); L = Math.max(L, n.m.L); R = Math.max(R, n.m.R); h += n.m.h + (i ? GY : 0); });
  return (b.m = { L, R, h });
}
function measureNode(n) {
  const own = Math.max(NMIN, NB + n.lines.length * NL);
  if (n.t === 'if' && chainOf(n)) {
    const { lv, fin, finBrk } = chainOf(n), tms = lv.map(c => measureBlock(c.then)), fm = measureBlock(fin);
    if (finBrk && mctx.length) mctx[mctx.length - 1].brkL = true;
    const maxL = Math.max(...tms.map(t => t.L), W / 2), maxR = Math.max(...tms.map(t => t.R), W / 2);
    const dr = Math.max(W / 2 + 24, fm.R + GX / 2) + maxL, railX = dr + maxR + 18;
    const ys = []; let lastE = 0;
    tms.forEach((t, i) => {
      ys.push(i ? Math.max(ys[i - 1] + DH + GY, lastE + 14 - DH / 2) : 0);
      lastE = ys[i] + DH / 2 + 22 + t.h + 12;
    });
    const yk = ys[ys.length - 1] + DH, yfe = vis(fin).length ? yk + GY + fm.h : yk;
    const ymg = Math.max(finBrk ? yfe + 26 : yfe + GY / 2, lastE + 14);
    n.m = { chain: true, lv, fin, finBrk, ys, dr, railX, ymg, L: Math.max(W / 2, fm.L), R: railX + 8, h: ymg + GY / 2 };
  } else if (n.t === 'if') {
    const t = measureBlock(n.then), e = measureBlock(n.els);
    if ((endsBreak(n.then) || endsBreak(n.els)) && mctx.length) mctx[mctx.length - 1].brk = true;
    if (!n.els.length && endsBreak(n.then)) {          // Yes が右へ出て、そのままループの外へ
      const dr = Math.max(t.L + GX / 2, W / 2 + 28);
      n.m = { L: W / 2, R: t.h ? dr + t.R : W / 2 + 24, h: DH + GY + (t.h ? t.h + 18 : 0), dr, side: true };
    } else if (!vis(n.els).length) {
      const bx = Math.max(t.R, W / 2) + 34;
      n.m = { L: Math.max(t.L, W / 2), R: bx + 8, h: DH + GY + t.h + GY, bx };
    } else {
      const dl = Math.max(t.R + GX / 2, W / 2 + 28), dr = Math.max(e.L + GX / 2, W / 2 + 28);
      n.m = { L: dl + t.L, R: dr + e.R, h: DH + GY + Math.max(t.h, e.h) + GY, dl, dr };
    }
  } else if (n.t === 'for' || n.t === 'while') {
    mctx.push({ brk: false, brkL: false });
    const b = measureBlock(n.body), c = mctx.pop(), r = Math.max(W / 2, b.R), l = Math.max(W / 2, b.L);
    n.m = { L: l + (c.brkL ? 26 : 0), R: r + (c.brk ? 26 : 0), rx: r + 16, lx: l + 16, brk: c.brk || c.brkL,
      h: own + GY + (b.h ? b.h + GY : 0) + HE + (c.brk || c.brkL ? 24 : 0), hs: own };
  } else n.m = { L: W / 2, R: W / 2, h: own };
}

function flowSVG(layout = 'row') {
  const P = [], pctx = [];   // SVG の部品、break の出口待ち
  const arrowHead = (x1, y1, x2, y2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8, c = Math.cos(a), d = Math.sin(a);
    P.push(`<polygon class="ahead" points="${x2},${y2} ${x2 - s * c + s * .45 * d},${y2 - s * d - s * .45 * c} ${x2 - s * c - s * .45 * d},${y2 - s * d + s * .45 * c}"/>`);
  };
  const line = (pts, arrow) => {
    P.push(`<polyline class="edge" points="${pts.map(p => p.join(',')).join(' ')}"/>`);
    if (arrow) arrowHead(...pts[pts.length - 2], ...pts[pts.length - 1]);
  };
  const text = (lines, cx, cy) => {
    const y0 = cy - (lines.length - 1) * NL / 2;
    return `<text text-anchor="middle" dominant-baseline="central">` +
      lines.map((l, i) => `<tspan x="${cx}" y="${y0 + i * NL}">${esc(l)}</tspan>`).join('') + '</text>';
  };
  const shape = (id, kind, cx, y, w, h, lines) => {
    const x = cx - w / 2; let s;
    const poly = pts => `<polygon class="shape" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    if (kind === 'term') s = `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/>`;
    else if (kind === 'io') s = poly([[x + 16, y], [x + w, y], [x + w - 16, y + h], [x, y + h]]);
    else if (kind === 'if') s = poly([[cx, y], [x + w, y + h / 2], [cx, y + h], [x, y + h / 2]]);
    else if (kind === 'ls') s = poly([[x + 14, y], [x + w - 14, y], [x + w, y + 14], [x + w, y + h], [x, y + h], [x, y + 14]]);
    else if (kind === 'le') s = poly([[x, y], [x + w, y], [x + w, y + h - 14], [x + w - 14, y + h], [x + 14, y + h], [x, y + h - 14]]);
    else if (kind === 'call') s = `<path class="shape" d="M${x},${y}h${w}v${h}h${-w}z M${x + 10},${y}v${h} M${x + w - 10},${y}v${h}"/>`;
    else s = `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
    P.push(`<g class="node" data-id="${id}">${s}${text(lines, cx, y + h / 2)}</g>`);
  };
  const label = (id, which, x, y, anchor) =>
    P.push(`<text class="blabel" id="lb-${id}-${which}" x="${x}" y="${y}" text-anchor="${anchor}">${which === 'yes' ? 'Yes' : 'No'}</text>`);
  const rail = (brk, pts, side = 'R') => pctx[pctx.length - 1].push({ id: brk.id, pts, side });

  const placeBlock = (b, cx, y) => {
    vis(b).forEach((n, i) => { if (i) { line([[cx, y], [cx, y + GY]], true); y += GY; } y = placeNode(n, cx, y); });
    return y;
  };
  const placeNode = (n, cx, y) => {
    if (n.t === 'if' && n.m.chain) {
      const { lv, fin, ys } = n.m, xr = cx + n.m.dr, rx = cx + n.m.railX, yM = y + n.m.ymg;
      let first = null;
      lv.forEach((c, i) => {
        const yi = y + ys[i], ymid = yi + DH / 2, top = ymid + 22;
        shape(c.id, 'if', cx, yi, W, DH, c.lines);
        line([[cx + W / 2, ymid], [xr, ymid], [xr, top]], true);
        label(c.id, 'yes', cx + W / 2 + 2, ymid - 7, 'start');
        label(c.id, 'no', cx + 8, yi + DH + LBY, 'start');
        const tb = vis(c.then).length ? placeBlock(c.then, xr, top) : top, ee = tb + 12;
        line([[xr, tb], [xr, ee], [rx, ee]]);
        if (first === null) first = ee;
        if (i < lv.length - 1) line([[cx, yi + DH], [cx, y + ys[i + 1]]], true);
      });
      const yk = y + ys[ys.length - 1] + DH;
      let yfe = yk;
      if (vis(fin).length) { line([[cx, yk], [cx, yk + GY]], true); yfe = placeBlock(fin, cx, yk + GY); }
      if (n.m.finBrk) rail(fin[fin.length - 1], [[cx, yfe], [cx, yfe + 12]], 'L');
      else line([[cx, yfe], [cx, yM]]);
      line([[rx, first], [rx, yM], [cx, yM]], true);
      line([[cx, yM], [cx, y + n.m.h]]);
      return y + n.m.h;
    }
    if (n.t === 'if') {
      shape(n.id, 'if', cx, y, W, DH, n.lines);
      const ym = y + DH / 2, yb = y + DH, yM = y + n.m.h, brk = b => b[b.length - 1];
      if (n.m.side) {
        line([[cx, yb], [cx, yM]]);
        label(n.id, 'no', cx + 8, yb + LBY, 'start');
        label(n.id, 'yes', cx + W / 2 + 2, ym - 7, 'start');
        if (!vis(n.then).length) rail(brk(n.then), [[cx + W / 2, ym]]);
        else {
          const xr = cx + n.m.dr;
          line([[cx + W / 2, ym], [xr, ym], [xr, yb + GY]], true);
          const yT = placeBlock(n.then, xr, yb + GY);
          rail(brk(n.then), [[xr, yT], [xr, yT + 12]]);
        }
      } else if (!vis(n.els).length) {
        line([[cx, yb], [cx, yb + GY]], true);
        label(n.id, 'yes', cx + 8, yb + LBY, 'start');
        const yT = placeBlock(n.then, cx, yb + GY);
        line([[cx, yT], [cx, yM]]);
        line([[cx + W / 2, ym], [cx + n.m.bx, ym], [cx + n.m.bx, yM - GY / 2], [cx, yM - GY / 2]], true);
        label(n.id, 'no', cx + W / 2 + 4, ym - 7, 'start');
      } else {
        const xl = cx - n.m.dl, xr = cx + n.m.dr;
        line([[cx - W / 2, ym], [xl, ym], [xl, yb + GY]], true);
        label(n.id, 'yes', cx - W / 2 - 2, ym - 7, 'end');
        const yT = placeBlock(n.then, xl, yb + GY);
        line([[xl, yT], [xl, yM - GY / 2], [cx, yM - GY / 2]]);
        line([[cx + W / 2, ym], [xr, ym], [xr, yb + GY]], true);
        label(n.id, 'no', cx + W / 2 + 2, ym - 7, 'start');
        const yE = placeBlock(n.els, xr, yb + GY);
        if (endsBreak(n.els)) rail(brk(n.els), [[xr, yE], [xr, yE + 12]]);
        else line([[xr, yE], [xr, yM - GY / 2], [cx, yM - GY / 2]]);
        line([[cx, yM - GY / 2], [cx, yM]]);
      }
      return yM;
    }
    if (n.t === 'for' || n.t === 'while') {
      shape(n.id, 'ls', cx, y, W, n.m.hs, n.lines);
      let y2 = y + n.m.hs;
      line([[cx, y2], [cx, y2 + GY]], true); y2 += GY;
      pctx.push([]);
      if (vis(n.body).length) { y2 = placeBlock(n.body, cx, y2); line([[cx, y2], [cx, y2 + GY]], true); y2 += GY; }
      shape(n.endId, 'le', cx, y2, W, HE, [n.loopName]);
      y2 += HE;
      const rails = pctx.pop();
      if (n.m.brk) {
        const ye = y2 + 12;
        for (const r of rails) {
          const rx = r.side === 'L' ? cx - n.m.lx : cx + n.m.rx;
          const pts = [...r.pts, [rx, r.pts[r.pts.length - 1][1]], [rx, ye], [cx, ye]];
          P.push(`<g class="node rail" data-id="${r.id}"><polyline class="shape" points="${pts.map(p => p.join(',')).join(' ')}"/></g>`);
          arrowHead(rx, ye, cx, ye);
        }
        line([[cx, y2], [cx, y2 + 24]]); y2 += 24;
      }
      return y2;
    }
    const kind = (n.t === 'input' || n.t === 'output') ? 'io' : n.t === 'call' ? 'call' : 'proc';
    shape(n.id, kind, cx, y, W, n.m.h, n.lines);
    return y + n.m.h;
  };

  const charts = [{ s: 'start', st: 'はじめ', e: 'end', et: 'おわり', body: prog.body },
    ...prog.funcs.map(f => ({ s: f.id, st: `関数 ${f.name}(${f.params.join(', ')})`, e: f.id + 'x', et: '戻る', body: f.body }))];
  // row：関数の図を右に並べる／col：関数の図を下に並べる（印刷用）
  const pad = 14; let x0 = pad, y0 = pad, H = 0, width = 0;
  for (const c of charts) {
    mctx = [];
    const m = measureBlock(c.body), tw = Math.max(TW, c.st.length * 10 + 36);
    const cx = x0 + Math.max(m.L, tw / 2);
    let y = y0;
    shape(c.s, 'term', cx, y, tw, TH, [c.st]); y += TH;
    line([[cx, y], [cx, y + GY]], true); y += GY;
    y = placeBlock(c.body, cx, y);
    line([[cx, y], [cx, y + GY]], true); y += GY;
    shape(c.e, 'term', cx, y, TW, TH, [c.et]); y += TH + pad;
    H = Math.max(H, y);
    width = Math.max(width, cx + Math.max(m.R, tw / 2) + pad);
    if (layout === 'row') x0 = cx + Math.max(m.R, tw / 2) + 44; else y0 = y + 16;
  }
  return { svg: P.join(''), width, H };
}

function drawFlow() {
  const { svg, width, H } = flowSVG('row');
  // 横に広い図は、文字が小さくなりすぎない範囲（8割まで）で縮めて表示する。それ以上は横スクロール
  const fit = $('flowWrap').clientWidth - 24, shown = Math.round(Math.max(width * 0.8, Math.min(width, fit)));
  $('flowWrap').innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${H}" width="${shown}" role="img" aria-label="フローチャート">${svg}</svg>`;
}

/* ---------- 画面の更新 ---------- */
function $(id) { return document.getElementById(id); }

function varTable(env, prevEnv) {
  const ch = prevEnv ? diffEnv(prevEnv, env) : [];
  return Object.keys(env).map(k => {
    const v = env[k];
    const cell = Array.isArray(v)
      ? (v.length ? '<span class="cells">' + v.map((x, i) => `<span class="cell${ch.some(c => c.name === k && (c.i === i || c.i === undefined)) ? ' chg' : ''}"><i>${i}</i><b>${esc(typeof x === 'string' ? x : fmt(x, k))}</b></span>`).join('') + '</span>'
        : `<span class="val${ch.some(c => c.name === k) ? ' chg' : ''}">[ ]（空）</span>`)
      : `<span class="val${ch.some(c => c.name === k) ? ' chg' : ''}">${esc(fmt(v, k))}</span>`;
    return `<tr><th>${esc(k)}</th><td>${cell}</td></tr>`;
  }).join('');
}

function render() {
  const st = T[idx], prev = idx ? T[idx - 1] : null;
  const pendId = pending ? T[idx + 1].id : null;
  document.querySelectorAll('.node').forEach(g => {
    g.classList.toggle('cur', g.dataset.id === st.id);
    g.classList.toggle('pend', g.dataset.id === pendId);
  });
  document.querySelectorAll('.blabel').forEach(t => t.classList.remove('taken'));
  if (st.branch) { const lb = $(`lb-${st.id}-${st.branch}`); if (lb) lb.classList.add('taken'); }
  document.querySelectorAll('.ln').forEach(l => {
    l.classList.toggle('cur', +l.dataset.line === lineOf[st.id]);
    l.classList.toggle('pend', pendId !== null && +l.dataset.line === lineOf[pendId]);
  });

  // 変数の表（関数の中にいるときは、関数ごとに分けて表示する）
  const multi = prog.funcs.length > 0;
  const html = st.frames.map((f, i) => {
    const pf_ = prev && prev.frames[i] && prev.frames.length >= st.frames.length ? prev.frames[i].env : (prev && prev.frames[i] ? prev.frames[i].env : (i === 0 ? {} : null));
    const rows = varTable(f.env, i === st.frames.length - 1 ? (pf_ || {}) : null);
    const cap = multi ? `<div class="frame${i < st.frames.length - 1 ? ' dim' : ''}">${i === 0 ? 'メインの変数' : `関数 ${esc(f.name)} の中の変数`}</div>` : '';
    return cap + (rows ? `<table${i < st.frames.length - 1 ? ' class="dim"' : ''}>${rows}</table>` : '<span class="empty">まだ変数はありません</span>');
  }).join('');
  $('vars').innerHTML = html;
  $('out').innerHTML = st.out.length ? esc(st.out.join('\n')) : '<span class="empty">まだ何も表示されていません</span>';

  // 説明と予想モードの問題
  const q = pending ? T[idx + 1].q : null;
  $('msg').innerHTML = (fb ? `<span class="${fb.ok ? 'ok' : 'ng'}">${fb.ok ? '○ 正解！' : '× ざんねん。'}</span> ` : '') + esc(pending ? '次の記号（青い点線）を実行するとどうなる？' : st.msg);
  const quiz = $('quiz');
  quiz.classList.toggle('on', !!q);
  if (q) {
    quiz.innerHTML = q.kind === 'yn'
      ? `<span>${esc(q.text)}</span><button data-a="yes">Yes（成り立つ）</button><button data-a="no">No（成り立たない）</button><button data-a="skip">答えを見る</button>`
      : `<span>この処理のあと、<b>${esc(q.label)}</b> の値は？</span><input type="text" id="qIn" autocomplete="off"><button data-a="val">答える</button><button data-a="skip">答えを見る</button>`;
    const qi = $('qIn'); if (qi) qi.focus();
  } else quiz.innerHTML = '';

  $('count').textContent = `ステップ ${idx} / ${T.length - 1}`;
  $('slider').max = T.length - 1; $('slider').value = idx;
  $('bPrev').disabled = $('bFirst').disabled = idx === 0 && !pending;
  $('bNext').disabled = idx >= T.length - 1 || pending;
  $('bPlay').disabled = predict || idx >= T.length - 1;
  $('bPlay').textContent = playing ? '⏸ 止める' : '▶ 自動再生';
  $('score').textContent = predict ? `正解 ${score.ok} / ${score.n} 問` : '';

  // 今の記号が見える位置までスクロール
  const g = document.querySelector('.node.pend') || document.querySelector('.node.cur'), wrap = $('flowWrap');
  if (g) {
    const r = g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    if (r.top < w.top + 30 || r.bottom > w.bottom - 30)
      wrap.scrollTo({ top: wrap.scrollTop + (r.top + r.height / 2) - (w.top + w.height / 2), behavior: 'smooth' });
    if (r.left < w.left || r.right > w.right) wrap.scrollLeft += (r.left + r.width / 2) - (w.left + w.width / 2);
  }
}

function stop() { if (playing) { clearInterval(playing); playing = null; } }
function go(i) { stop(); pending = false; fb = null; idx = Math.max(0, Math.min(T.length - 1, i)); render(); }
function next() {
  if (pending) return;
  if (idx >= T.length - 1) { stop(); render(); return; }
  fb = null;
  if (predict && T[idx + 1].q && !answered.has(idx + 1)) { pending = true; render(); return; }
  idx++;
  if (idx >= T.length - 1) stop();
  render();
}
function answer(kind) {
  if (!pending) return;
  const q = T[idx + 1].q; let ok = false;
  if (kind === 'val') {
    const raw = $('qIn').value.trim().replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/^[−ー－]/, '-');
    if (raw === '') { $('qIn').focus(); return; }
    ok = typeof q.answer === 'number' ? Math.abs(Number(raw) - q.answer) < 1e-9 : raw.replace(/^["'「]|["'」]$/g, '') === String(q.answer);
  } else if (kind !== 'skip') ok = (kind === 'yes') === q.answer;
  answered.add(idx + 1); score.n++; if (ok) score.ok++;
  fb = { ok }; pending = false; idx++; render();
}
function togglePlay() {
  if (playing) { stop(); render(); return; }
  if (predict || idx >= T.length - 1) return;
  playing = setInterval(next, +$('speed').value); render();
}

/* ---------- 例題・課題の読みこみ ---------- */
function readInputs() {
  const v = {}; let err = '';
  for (const d of ex.inputs || []) {
    const el = $('in-' + d.name);
    if (!el) { v[d.name] = Array.isArray(d.def) ? d.def.slice() : d.def; continue; }   // 入力欄を作り直している途中
    const raw = el.value.trim();
    if (d.type === 'list' || d.type === 'slist') {
      const parts = raw.split(/[,、，]+/).map(s => s.trim()).filter(s => s !== '');
      const lo = d.minLen || 2, hi = d.maxLen || 8;
      const vals = d.type === 'list' ? parts.map(Number) : parts;
      let bad = vals.length < lo || vals.length > hi;
      if (d.type === 'list') bad = bad || vals.some(x => !Number.isFinite(x) || (!d.float && !Number.isInteger(x)) || Math.abs(x) > 99999);
      if (d.options) bad = bad || vals.some(x => !d.options.includes(x));
      const msg = bad ? `${d.label} は${d.options ? ' ' + d.options.join('・') + ' から' : d.type === 'list' ? (d.float ? '数' : '整数') + 'を' : ''} ${lo === hi ? lo : lo + '〜' + hi} 個、カンマで区切って入れてください` : (d.check ? d.check(vals) : '');
      if (msg) { err = msg; v[d.name] = d.def.slice(); } else v[d.name] = vals;
    } else if (d.type === 'text') v[d.name] = raw || d.def;
    else {
      let x = Number(raw);
      if (raw === '' || !Number.isFinite(x)) x = d.def;
      if (d.type !== 'float') x = Math.round(x);
      v[d.name] = Math.max(d.min, Math.min(d.max, x));
    }
  }
  $('inputErr').textContent = err;
  return v;
}
function compileProg(e, vals) {
  ex = e; inp = vals; floatSet = new Set(e.floats || []);
  prog = { body: e.body(), funcs: e.funcs ? e.funcs() : [] };
  const st = { id: 0, loop: 0 };
  prepare(prog.body, st);
  for (const f of prog.funcs) { f.id = 'f' + (st.id++); prepare(f.body, st); }
  T = buildTrace();
}
function rebuild() {
  stop();
  compileProg(ex, readInputs());
  showPy = TEACHER || ex.kind === EX || ex.kind === SUP;
  buildPython(); drawFlow();
  idx = 0; pending = false; fb = null; answered = new Set(); score = { ok: 0, n: 0 };
  $('flowWrap').scrollTop = 0; $('flowWrap').scrollLeft = 0;
  render();
}

  $('inputs').innerHTML = (ex.inputs || []).map(d => {
    if (d.type === 'list' || d.type === 'slist') return `<label>${esc(d.label)} <input class="list" type="text" id="in-${d.name}" value="${esc(d.type === 'list' && d.float ? d.def.map(pf).join(', ') : d.def.join(', '))}"></label>`;
    if (d.type === 'text') return `<label>${esc(d.label)} <input type="text" style="width:110px" id="in-${d.name}" value="${esc(d.def)}"></label>`;
    return `<label>${esc(d.label)} <input type="number" id="in-${d.name}" value="${d.def}" min="${d.min}" max="${d.max}" step="${d.type === 'float' ? 'any' : d.step || 1}"></label>`;

const isTask = p => p.kind === K1 || p.kind === K2;
const defaults = e => Object.fromEntries((e.inputs || []).map(d => [d.name, Array.isArray(d.def) ? d.def.slice() : d.def]));
let screenState = null;

function openPrint() {
  stop();
  screenState = { ex, inp, les: +$('lesSel').value, prog: +$('exSel').value };
  document.body.classList.add('printing');
  buildPages();
  window.scrollTo(0, 0);

  document.body.classList.remove('printing');

function buildPages() {
  const range = $('pRange').value, mode = $('pMode').value, withOut = $('pOut').checked;
  const { les: li, prog: pi } = screenState, list = [];
  LESSONS.forEach((l, i) => l.progs.forEach((p, j) => {
    const ok = range === 'cur' ? i === li && j === pi : range === 'les' ? i === li : range === 'lesK' ? i === li && isTask(p)
      : range === 'allK' ? isTask(p) : true;
    if (ok) list.push([i, j]);
  }));
  let hidden = 0;
  const pages = list.map(([i, j]) => {
    const e = LESSONS[i].progs[j];
    compileProg(e, i === li && j === pi ? screenState.inp : defaults(e));
    buildPython();
    useGeom('print');
    const figs = [flowSVG('row')];
    if (prog.funcs.length) figs.push(flowSVG('col'));
    useGeom('screen');
    const code = mode === 'code' && (TEACHER || !isTask(e));
    if (mode === 'code' && !code) hidden++;
    // 図だけでは値が分からないリスト（「5 個の値のリスト」など）は、データとして書いておく
    const data = (e.inputs || []).filter(d => (d.type === 'list' || d.type === 'slist') && !d.feed)
      .map(d => `${/^[A-Za-z_]\w*$/.test(d.name) && pyLines.some(l => l.trim().startsWith(d.name + ' = [')) ? d.name : d.label} = ${lit(inp[d.name], d.float)}`);
    return { les: LESSONS[i].title, e, figs, py: pyLines.filter(l => !(mode === 'code' && /^#/.test(l))), code,
      data, stdin: dump.stdin.slice(), rand: dump.rand.slice(), out: dump.out.slice(), withOut };
  });
  $('pages').innerHTML = pages.map(pageHTML).join('');
  $('pages').querySelectorAll('.page').forEach((el, k) => fitPage(el, pages[k]));
  $('pCount').textContent = `${pages.length} 枚`;
  $('pNote').textContent = (hidden ? `課題 ${hidden} 枚は、解答が生徒に見えないよう右の欄を空欄にしています（教員用に ?teacher=1 を付けて開くと、課題もプログラムつきで印刷できます）。 ` : '')
    + '印刷の設定：用紙 A4・縦、倍率 100％（「ページに合わせる」はオフ）。ヘッダーとフッターはオフがおすすめです。';
}

function pageHTML(pg) {
  const e = pg.e;
  const how = pg.code ? '左のフローチャートと右のプログラムを見くらべて、対応しているところを確かめよう。'
    : '左のフローチャートを読んで、右の欄に Python のプログラムを書こう。';
  const ins = [];
  if (pg.stdin.length) ins.push(`入力：${pg.stdin.map(esc).join('、')}`);
  if (pg.rand.length) ins.push(`乱数で決まった値：${pg.rand.map(esc).join('、')}`);
  const n = pg.out.length, cols = n > 20 ? ' c3' : n > 10 ? ' c2' : '';
  return `<section class="page">
  <div class="ph">
    <div class="ptop"><span>${esc(pg.les)}</span><span class="pname"><span></span>年<span></span>組<span></span>番 氏名<span class="nm"></span></span></div>
    <div class="pt"><span class="pkind">${esc(e.kind)}</span>${esc(e.title)}</div>
  </div>
  <p class="pdesc"><b>${esc(how)}</b> ${esc(e.desc.replace(/（入力する.*?）|（入力が尽きたら.*?）|[^。]*ここで決めて[^。]*。/g, ''))}</p>
  ${pg.data.length ? `<p class="pdata">使うデータ：${pg.data.map(esc).join('　')}</p>` : ''}
  <div class="pbody">
    <div class="pflow"><div class="pcap">フローチャート</div><div class="pfig"></div></div>
    <div class="pcode">
      <div class="pwrite"><div class="pcap">${pg.code ? 'Python プログラム' : 'Python プログラムを書こう'}</div><div class="prows"></div></div>
      ${pg.withOut ? `<div class="pout"><div class="pcap">実行例</div>${ins.length ? `<div class="pin">${ins.join('<br>')}</div>` : ''}<pre class="${cols.trim()}">${esc(pg.out.join('\n')) || '（何も表示されない）'}</pre></div>` : ''}
    </div>
  </div>
</section>`;
}

function fitPage(el, pg) {
  // フローチャート：枠に入る大きさに縮める（大きくしすぎない）。関数があるときは、横並び・縦並びの大きく見える方を使う
  // 左の枠の幅は、図に合わせて A4 幅の 50〜64％ の間で決める（残りがプログラムの欄）
  const flow = el.querySelector('.pflow'), box = el.querySelector('.pfig'), total = el.querySelector('.pbody').clientWidth;
  const lo = total * 0.5, hi = total * 0.64, extra = 10, bh = box.clientHeight - 6;
  const sc = f => Math.min((hi - extra) / f.width, bh / f.H, 1.15);
  const f = pg.figs.reduce((a, b) => (sc(b) > sc(a) ? b : a));
  const k = sc(f);
  flow.style.flexBasis = Math.round(Math.max(lo, Math.min(hi, f.width * k + extra))) + 'px';
  box.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${f.width} ${f.H}" preserveAspectRatio="xMidYMin meet" style="max-width:${Math.floor(f.width * k)}px;max-height:${Math.floor(f.H * k)}px" role="img" aria-label="フローチャート">${f.svg}</svg>`;
  el.dataset.scale = k.toFixed(2);
  // 右の欄：罫線（行番号つき）。プログラムつきのときは、行に合わせて書きこむ
  const rows = el.querySelector('.prows'), H = rows.clientHeight, cw = rows.clientWidth;
  const cols = l => [...l].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 2 : 1), 0);   // 全角は2文字分
  // 9px でも入らない長い行は、続きを次の行に折り返す（行番号は最初の行だけ）
  const FMIN = 9, room = Math.floor((cw - 36) / (FMIN * 0.6)), disp = [];
  pg.py.forEach((l, k) => {
    if (cols(l) <= room) { disp.push({ no: k + 1, t: l }); return; }
    const ind = l.match(/^ */)[0] + '    ';
    let cur = '', first = true;
    for (const ch of l) {
      if (cols(cur + ch) > room) { disp.push({ no: first ? k + 1 : '', t: cur, w: true }); cur = ind; first = false; }
      cur += ch;
    }
    disp.push({ no: first ? k + 1 : '', t: cur, w: true });
  });
  const need = pg.code ? disp.length : 0;
  const rh = Math.max(16, Math.min(28, need ? Math.floor(H / need) : 28)), n = Math.floor(H / rh);
  const lineFs = l => Math.max(FMIN, Math.min(11, (cw - 36) / (Math.max(1, cols(l)) * 0.6)));
  const guide = [1, 2, 3].map(g => `<span class="g" style="left:${30 + g * 4 * 11 * 0.6}px"></span>`).join('');
  let html = '';
  for (let r = 0; r < n; r++) {
    const d = pg.code ? disp[r] : undefined, t = d ? d.t : undefined;
    html += `<div class="prow" style="height:${rh}px"><i>${d ? d.no : pg.code ? '' : r + 1}</i>${t !== undefined ? `<code style="font-size:${(d.w ? FMIN : lineFs(t)).toFixed(1)}px">${esc(t)}</code>` : ''}${pg.code ? '' : guide}</div>`;
  }
  rows.innerHTML = html;
}

['pRange', 'pMode', 'pOut'].forEach(id => $(id).addEventListener('change', buildPages));
if (new URLSearchParams(location.search).has('print')) {   // ?print=all などで、開いてすぐプリント画面にする
  const v = new URLSearchParams(location.search).get('print');
  if ([...$('pRange').options].some(o => o.value === v)) $('pRange').value = v;
  if (new URLSearchParams(location.search).get('mode') === 'code') $('pMode').value = 'code';
  openPrint();
}
</script>
</body>
</html>
